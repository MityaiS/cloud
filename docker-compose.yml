services: 
  db:
    image: postgres:15
    container_name: cloud_db
    environment: 
      POSTGRES_USER: cloud_admin
      POSTGRES_PASSWORD: $
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U cloud_admin"]
      interval: 5s 
      timeout: 5s 
      retries: 5
  minio: 
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: 
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASWORD: minioadmin
    volumes: 
      - minio_data:/data
    ports: 
      - "9001:9001"
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s 
      timeout: 5s 
      retries: 3

  backend:
    build: .
    env_file: .env 
    ports: 
      - "8000:8000"
    depends_on: 
      db: 
        condition: service_healthy
      minio: 
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: 
  minio_data: 